<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16202e" />
      <stop offset="70%" stop-color="#0a0c12" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>
    <linearGradient id="cyanRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="amberCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="2" />

  <!-- Outer Tech HUD Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#0891b2" stroke-opacity="0.4" stroke-width="4" stroke-dasharray="16 8" />
  
  <!-- Glowing Cyan Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#cyanRing)" stroke-width="8" filter="url(#glow)" />
  
  <!-- Inner Segmented Tech Ring -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="40 10 10 10" />

  <!-- Crosshairs / Radar Marks -->
  <line x1="256" y1="46" x2="256" y2="86" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="426" x2="256" y2="466" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" />
  <line x1="46" y1="256" x2="86" y2="256" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" />
  <line x1="426" y1="256" x2="466" y2="256" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" />

  <!-- Central Resonance Diamond -->
  <polygon points="256,170 330,256 256,342 182,256" fill="url(#amberCore)" filter="url(#glow)" />
  <polygon points="256,196 304,256 256,316 208,256" fill="#ffffff" fill-opacity="0.9" />
  <circle cx="256" cy="256" r="12" fill="#0891b2" />
</svg>
